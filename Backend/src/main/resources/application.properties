spring.application.name=module-c-backend
spring.config.import=optional:file:.env[.properties]
server.port=${SERVER_PORT:8082}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jackson.serialization.WRITE_DATES_AS_TIMESTAMPS=false
server.servlet.session.cookie.same-site=lax
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console

app.auth.frontend-base-url=${FRONTEND_BASE_URL:http://localhost:5173}
app.auth.oauth-success-path=${AUTH_OAUTH_SUCCESS_PATH:/auth/oauth-success}
app.auth.oauth-failure-path=${AUTH_OAUTH_FAILURE_PATH:/auth}
app.auth.reset-token-hours=${AUTH_RESET_TOKEN_HOURS:2}
app.auth.verification-token-hours=${AUTH_VERIFICATION_TOKEN_HOURS:24}
app.auth.invite-token-hours=${AUTH_INVITE_TOKEN_HOURS:72}
app.auth.forgot-password-cooldown-seconds=${AUTH_FORGOT_PASSWORD_COOLDOWN_SECONDS:30}
app.auth.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
app.auth.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}
app.auth.bootstrap-admin.full-name=${BOOTSTRAP_ADMIN_FULL_NAME:Campus Operations Admin}
app.auth.sample-users.enabled=${AUTH_SAMPLE_USERS_ENABLED:false}
app.auth.sample-users.student.email=${AUTH_SAMPLE_STUDENT_EMAIL:}
app.auth.sample-users.student.password=${AUTH_SAMPLE_STUDENT_PASSWORD:}
app.auth.sample-users.student.full-name=${AUTH_SAMPLE_STUDENT_FULL_NAME:Sample Student}
app.auth.sample-users.student.student-id=${AUTH_SAMPLE_STUDENT_ID:IT24240001}
app.auth.sample-users.student.faculty=${AUTH_SAMPLE_STUDENT_FACULTY:IT}
app.auth.sample-users.student.batch=${AUTH_SAMPLE_STUDENT_BATCH:2024}
app.auth.sample-users.student.campus=${AUTH_SAMPLE_STUDENT_CAMPUS:malabe}
app.auth.sample-users.student.phone=${AUTH_SAMPLE_STUDENT_PHONE:+94 712345678}
app.auth.sample-users.technician.email=${AUTH_SAMPLE_TECHNICIAN_EMAIL:technician@campus.edu}
app.auth.sample-users.technician.password=${AUTH_SAMPLE_TECHNICIAN_PASSWORD:Technician@123}
app.auth.sample-users.technician.full-name=${AUTH_SAMPLE_TECHNICIAN_FULL_NAME:Sample Technician}
app.auth.mail.from-address=${AUTH_MAIL_FROM_ADDRESS:}
app.auth.mail.from-name=${AUTH_MAIL_FROM_NAME:CampusHub}

spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
